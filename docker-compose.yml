services:
  mysql:
    image: mysql:8.4
    container_name: tcga-glioma-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tcga_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tcga_glioma}
      MYSQL_USER: ${MYSQL_USER:-tcga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tcga_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-tcga}", "-p${MYSQL_PASSWORD:-tcga_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: tcga-glioma-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
